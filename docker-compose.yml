services:
  mongo:
    image: mongo:8
    container_name: mundial-2018-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mundial2018_full
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mundial

  app:
    build: .
    container_name: mundial-2018-app
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      NODE_ENV: "production"
      MONGODB_URI: "mongodb://mongo:27017/mundial2018_full"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mundial
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo_data:

networks:
  mundial:
    driver: bridge
